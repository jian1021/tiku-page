services:
  backend:
    build: ./backend
    container_name: tiku-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./data/app.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8080}
      RELOAD: "0"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    container_name: tiku-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

  admin:
    build: ./admin
    container_name: tiku-admin
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - backend-data:/app/data
    ports:
      - "${ADMIN_PORT:-8501}:8501"

volumes:
  backend-data:
